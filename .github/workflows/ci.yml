name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The remote's catalog can change without a commit here; the weekly run catches drift.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p ${{ matrix.python }} && uv pip install -e . pytest==8.4.2
      - run: .venv/bin/pytest -q
      - run: uv build

  catalog-parity:
    name: README matches live tool catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_catalog_parity.py
